name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release tag name (defaults to app version, e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS (universal dmg)
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: --target universal-apple-darwin
          - os: ubuntu-22.04
            platform: Linux (AppImage + deb)
            rust_targets: ""
            build_args: ""
          - os: windows-latest
            platform: Windows (msi + nsis)
            rust_targets: ""
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apex-ui/package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apex-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install UI deps
        working-directory: apex-ui
        run: bun install --frozen-lockfile

      - name: Install Linux deps (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.os }}
          shared-key: ci-${{ runner.os }}

      - name: Build + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apex-tauri
          # Tag push → the tag itself; manual dispatch → explicit input, else
          # the action's __VERSION__ placeholder (the app version, e.g. v0.1.0).
          tagName: ${{ inputs.release_name || (github.event_name == 'workflow_dispatch' && 'v__VERSION__') || github.ref_name }}
          releaseName: "APEX Terminal v__VERSION__"
          releaseBody: "Installers for macOS (universal .dmg), Linux (.AppImage + .deb), and Windows (.msi + .nsis). See CHANGELOG.md for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.build_args }}
