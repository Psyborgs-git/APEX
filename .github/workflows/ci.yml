name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Tauri/WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ci-${{ runner.os }}

      - name: fmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace --locked

  ui:
    name: UI (lint · typecheck · build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apex-ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apex-ui/package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apex-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: lint
        run: bunx eslint src --max-warnings 0

      - name: typecheck + build
        run: bun run build

  python:
    name: Python sidecar (pytest)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apex-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apex-python/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q
